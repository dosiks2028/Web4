<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a train ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--green:#0F6B5F;--amber:#F2A93B;--ink:#16302B;--soft:#F4F7F5;--mist:#E6EFEC}
body{font-family:'Montserrat',sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 12% 8%,#c6ded7,transparent 45%),radial-gradient(circle at 92% 92%,#f6e1b8,transparent 40%),var(--mist)}
.ticket{border:0;border-radius:1.5rem;overflow:hidden;box-shadow:0 1.5rem 3rem rgba(22,48,43,.18)}
.ticket-head{background:var(--green);color:#fff;padding:1.4rem 1.75rem}
.ticket-head h1{font-size:1.35rem;font-weight:700;margin:0}
.form-label,legend.form-label{font-size:.78rem;font-weight:600;margin-bottom:.35rem}
.form-control,.form-select{background-color:var(--soft);border:1px solid var(--mist);border-radius:.75rem;color:var(--ink);font-size:.85rem}
.form-control:focus,.form-select:focus{border-color:var(--green);box-shadow:0 0 0 .2rem rgba(15,107,95,.18)}
.form-floating>label{color:#7d918c;font-size:.8rem}
.trip{border:1px solid var(--green);border-radius:2rem;overflow:hidden}
.trip .btn{border:0;border-radius:0!important;color:var(--green);font-weight:600;font-size:.8rem;padding:.45rem 1.2rem}
.trip .btn-check:checked+.btn{background:var(--green);color:#fff}
.prefix{background:var(--green);color:#fff;border:0;font-weight:600;font-size:.85rem}
.form-check-input:checked{background-color:var(--green);border-color:var(--green)}
.form-check-input:focus{border-color:var(--green);box-shadow:0 0 0 .2rem rgba(15,107,95,.2)}
.form-check-label{font-size:.8rem}
.btn-go,.btn-clear{border-radius:2rem;padding:.7rem 1.8rem;font-weight:700;font-size:.85rem}
.btn-go{background:var(--amber);border:1px solid var(--amber);color:var(--ink)}
.btn-go:hover{background:#e29a28;color:var(--ink)}
.btn-clear{background:#fff;border:1px solid var(--ink);color:var(--ink)}
.btn-clear:hover{background:var(--ink);color:#fff}
</style>
</head>
<body>
<main class="container py-4 py-lg-5">
 <div class="row justify-content-center">
  <div class="col-12 col-lg-10 col-xl-8">
   <div class="card ticket">
    <header class="ticket-head"><h1>Book a train ticket</h1></header>
    <form class="card-body p-3 p-md-4 p-lg-5" action="#" method="get">
     <div class="row g-3">

      <div class="col-12">
       <div class="btn-group trip" role="group" aria-label="Trip type">
        <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
        <label class="btn" for="oneway">One way</label>
        <input type="radio" class="btn-check" name="trip" id="round" value="round">
        <label class="btn" for="round">Round trip</label>
       </div>
      </div>

      <div class="col-md-6"><div class="form-floating">
       <input type="text" class="form-control" id="from" name="from" placeholder="From" autocomplete="off" required>
       <label for="from">From</label></div></div>
      <div class="col-md-6"><div class="form-floating">
       <input type="text" class="form-control" id="to" name="to" placeholder="To" autocomplete="off" required>
       <label for="to">To</label></div></div>

      <div class="col-md-4">
       <label class="form-label" for="dep">Departure</label>
       <input type="date" class="form-control" id="dep" name="departure" required></div>
      <div class="col-md-4">
       <label class="form-label" for="ret">Return</label>
       <input type="date" class="form-control" id="ret" name="return"></div>
      <div class="col-md-4">
       <label class="form-label" for="pax">Passengers</label>
       <select class="form-select" id="pax" name="passengers">
        <option value="1" selected>1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option>
        <option value="4">4 adults</option><option value="5">5 adults</option><option value="6">6 adults</option>
       </select></div>

      <div class="col-12">
       <fieldset>
        <legend class="form-label">Carriage class</legend>
        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="class" id="c1" value="seat" required><label class="form-check-label" for="c1">Seat</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="class" id="c2" value="coupe" checked><label class="form-check-label" for="c2">Coupé</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="class" id="c3" value="sleeper"><label class="form-check-label" for="c3">Sleeper</label></div>
       </fieldset>
      </div>

      <div class="col-md-6">
       <label class="form-label" for="phone">Phone</label>
       <div class="input-group">
        <span class="input-group-text prefix" id="cc">+7</span>
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" aria-describedby="cc" autocomplete="tel-national" required>
       </div></div>
      <div class="col-md-6">
       <label class="form-label" for="email">Email</label>
       <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required></div>

      <div class="col-12">
       <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
        <label class="form-check-label" for="sms">Also send the ticket by SMS</label></div>
       <div class="form-check">
        <input class="form-check-input" type="checkbox" id="rules" name="rules" required>
        <label class="form-check-label" for="rules">I agree with the carriage rules</label></div>
      </div>

      <!-- HTML order: Clear, then Find trains. On phones flex-column-reverse puts Find trains on top. -->
      <div class="col-12 d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-4">
       <button type="reset" class="btn btn-clear">Clear</button>
       <button type="submit" class="btn btn-go">Find trains</button>
      </div>

     </div>
    </form>
   </div>
  </div>
 </div>
</main>
</body>
</html>
