<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve a table</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f6efe7;color:#3b2a20}
.card{border:0;border-radius:1.25rem;box-shadow:0 1rem 2.5rem rgba(59,42,32,.15)}
h1{font-family:Georgia,serif}
.btn-reserve{background:#b4532a;border-color:#b4532a;color:#fff;border-radius:2rem;padding:.65rem 2rem;font-weight:600}
.btn-reserve:hover{background:#963f1c;color:#fff}
</style>
</head>
<body>
<main class="container py-4 py-lg-5">
 <div class="row justify-content-center"><div class="col-12 col-md-9 col-lg-6">
  <div class="card p-3 p-md-4">
   <h1 class="mb-4">Reserve a table</h1>
   <form action="#" method="post">
    <div class="mb-3"><label class="form-label" for="name">Your name</label>
     <input type="text" class="form-control" id="name" name="name" autocomplete="name" required></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label>
     <input type="email" class="form-control" id="email" name="email" autocomplete="email" required></div>
    <div class="mb-3"><label class="form-label" for="phone">Phone</label>
     <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" required></div>
    <div class="row">
     <div class="col-6 mb-3"><label class="form-label" for="guests">Guests</label>
      <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" required></div>
     <div class="col-6 mb-3"><label class="form-label" for="date">Date</label>
      <input type="date" class="form-control" id="date" name="date" required></div>
    </div>
    <fieldset class="mb-3">
     <legend class="form-label fs-6">Seating</legend>
     <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="seating" id="inside" value="inside" required><label class="form-check-label" for="inside">Inside</label></div>
     <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace"><label class="form-check-label" for="terrace">Terrace</label></div>
    </fieldset>
    <div class="mb-3"><label class="form-label" for="meal">Meal</label>
     <select class="form-select" id="meal" name="meal"><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></div>
    <div class="mb-3"><label class="form-label" for="comments">Comments</label>
     <textarea class="form-control" id="comments" name="comments" rows="3"></textarea></div>
    <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" name="terms" required>
     <label class="form-check-label" for="terms">I agree to the terms</label></div>
    <button type="submit" class="btn btn-reserve">Reserve</button>
   </form>
  </div>
 </div></div>
</main>
</body>
</html>
